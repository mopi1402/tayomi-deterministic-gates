name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The engine needs Node 24.2 or later; pnpm comes at the version of packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Every tool a catalog gate requires: an integration test fails on a missing one.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - uses: astral-sh/setup-uv@v10
      - run: |
          uv tool install ruff@0.17.5
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm integration
